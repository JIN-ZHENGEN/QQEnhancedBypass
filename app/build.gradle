plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.xalsace.qqbypass'
    compileSdk 34

    // 显式钉死 NDK 版本：AGP 8.0.2 默认 25.1.8937393，
    // 不写死时若环境里装了别的版本，AGP 会触发自动下载并在 CI 上失败。
    ndkVersion "25.1.8937393"

    // 签名配置从 keystore.properties 读取（该文件已 gitignore，密钥不进版本库）。
    // 复制 keystore.properties.example 为 keystore.properties 并填入自己的密钥即可。
    signingConfigs {
        mySign {
            def ksPropsFile = rootProject.file("keystore.properties")
            if (ksPropsFile.exists()) {
                def ksProps = new Properties()
                ksPropsFile.withInputStream { ksProps.load(it) }
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    defaultConfig {
        applicationId "io.github.xalsace.qqbypass"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.0.10"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
        }

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    // 启用 prefab，让 CMake 能通过 find_package 找到 ByteHook 的预编译库
    buildFeatures {
        prefab true
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 有 keystore.properties 才用自定义签名；缺失则回退默认，避免构建失败
            if (rootProject.file("keystore.properties").exists()) {
                signingConfig signingConfigs.mySign
            }
        }
    }

    // ------------------------------------------------------------------
    // Native 库打包（DexKit / ByteHook / libnative-bypass 的根因修复）
    //
    // 现象：模块装到 LSPosed 后，DexKitBridge.create() 抛
    //   UnsatisfiedLinkError: couldn't find "libdexkit.so"
    // 真因：LSPosed 用 LspModuleClassLoader 在被注入进程里加载模块 dex，
    // 其 nativeLibraryDirectories 是 base.apk!/lib/arm64-v8a（APK 内路径）。
    // 而 AGP 默认（useLegacyPackaging=false）会把 so 以 DEFLATE 压缩写入，
    // 且不对齐到 4K 页——ART 无法从「压缩且未对齐的 APK 内 so」直接 mmap，
    // 于是从模块 ClassLoader 找不到 so。
    //
    // 修法：useLegacyPackaging=true 让 AGP 把 so 以 STORED（不压缩）+ 4K
    // 对齐写入 APK。Android 10+ 支持从 zip-aligned 不压缩的 APK 内 so 直接
    // mmap 加载，LspModuleClassLoader 即可命中。这与 extractNativeLibs 无关
    // （模块 dex 不走系统 classpath，extractNativeLibs 对模块 so 不生效）。
    // ------------------------------------------------------------------
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // ------------------------------------------------------------------
    // 单元测试（路线图第 5 项）
    //
    // 开启 returnDefaultValues：默认的 android.jar 里所有方法体都是
    // `throw new RuntimeException("Stub!")`，一调用就炸。本模块的
    // HookRegistry / Fingerprint / ModuleConfig 都会走 Log、System.currentTimeMillis
    // 这类 android API，不打开这个开关，纯 JVM 单测根本跑不起来。
    // 代价：android 方法在单测里返回默认值（Log.i 返回 0），这是可接受的 ——
    // 被测的是我们自己的逻辑，不是 android 的行为。
    // ------------------------------------------------------------------
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
    // 使用官方 Xposed API 仓库
    compileOnly 'de.robv.android.xposed:api:82:sources'
    compileOnly 'de.robv.android.xposed:api:82'

    // ByteHook - 字节跳动 PLT hook 框架（预编译 AAR，含 prefab 供 CMake 使用）
    implementation 'com.bytedance:bytehook:1.0.2'

    // DexKit - 按字符串常量/正则反查 dex，用于「版本无关」定位 hook 目标。
    // 这是本次 version-agnostic 改造的核心依赖：混淆器会改类名方法名，
    // 但方法体里引用的字符串常量基本不动（Intent action、协议命令名、
    // 错误码都是服务端语义）。详见 resolve/TargetResolver。
    // 注意：DexKit 内部用 kotlin + 反射读 dex，必须配 keep 规则，
    // 否则 release 构建（minifyEnabled true）会把它裁坏。
    implementation 'org.luckypray:dexkit:2.0.0'
    // Kotlin stdlib 必须显式声明。DexKit 是 Kotlin 写的，它的 aar 里
    // 并没有把 kotlin-stdlib 作为传递依赖带下来（aar 不带 pom 依赖信息），
    // 结果是从 Java 侧调用 FindMethod/MethodMatcher 这些 API 时
    // 报 `cannot access kotlin.jvm.functions.Function1 / kotlin.Unit`，
    // 而且错误信息指向的是我们自己的调用行，非常难定位。
    // 版本取 1.9.x：AGP 8.0 + Gradle 8.0 组合下 2.x 需要 Kotlin 2.0 插件支持。
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.23'

    // JUnit 4。scope 是 testImplementation：Xposed 模块没有 instrumentation，
    // 也不打算在真机上跑这些测试 —— 要验的是纯逻辑，跑在 JVM 上更快也更稳。
    testImplementation 'junit:junit:4.13.2'

    // Xposed API 在 main 里是 compileOnly（运行时由 LSPosed 框架注入，不打包进 APK），
    // 但 compileOnly 不会传递到 test classpath。HookRegistry 的方法签名里带
    // XC_LoadPackage.LoadPackageParam，测试要构造调用就得能引用这个类型，
    // 所以这里以 testImplementation 再声明一次（仅测试期可见，不影响 APK 体积）。
    testImplementation 'de.robv.android.xposed:api:82'
}
