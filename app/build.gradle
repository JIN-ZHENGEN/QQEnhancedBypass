plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.xalsace.qqbypass'
    compileSdk 34

    // 显式钉死 NDK 版本：AGP 8.0.2 默认 25.1.8937393，
    // 不写死时若环境里装了别的版本，AGP 会触发自动下载并在 CI 上失败。
    ndkVersion "25.1.8937393"

    // 签名配置从 keystore.properties 读取（该文件已 gitignore，密钥不进版本库）。
    // 复制 keystore.properties.example 为 keystore.properties 并填入自己的密钥即可。
    signingConfigs {
        mySign {
            def ksPropsFile = rootProject.file("keystore.properties")
            if (ksPropsFile.exists()) {
                def ksProps = new Properties()
                ksPropsFile.withInputStream { ksProps.load(it) }
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    defaultConfig {
        applicationId "io.github.xalsace.qqbypass"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.7"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
        }

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    // 启用 prefab，让 CMake 能通过 find_package 找到 ByteHook 的预编译库
    buildFeatures {
        prefab true
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 有 keystore.properties 才用自定义签名；缺失则回退默认，避免构建失败
            if (rootProject.file("keystore.properties").exists()) {
                signingConfig signingConfigs.mySign
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
    // 使用官方 Xposed API 仓库
    compileOnly 'de.robv.android.xposed:api:82:sources'
    compileOnly 'de.robv.android.xposed:api:82'

    // ByteHook - 字节跳动 PLT hook 框架（预编译 AAR，含 prefab 供 CMake 使用）
    implementation 'com.bytedance:bytehook:1.0.2'
}
