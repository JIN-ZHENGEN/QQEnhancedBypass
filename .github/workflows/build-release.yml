name: Build Release APK

on:
  push:
    branches: [qq-9.3.50-adaptation, main]
    tags: ['v*']
  pull_request:
    branches: [qq-9.3.50-adaptation, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # 发布 Release 需要写 contents。GitHub 新建仓库的默认 GITHUB_TOKEN 权限是
      # read（2023 年起），softprops/action-gh-release 会拿到 403
      # "Resource not accessible by integration" —— 这个报错看起来像认证坏了，
      # 实际只是缺一条权限声明。
      contents: write

    env:
      # runner 镜像预置了 ANDROID_HOME=/usr/local/lib/android/sdk。
      # AGP 会校验环境变量/local.properties/sdk.dir 是否指向同一路径，
      # 只改其中一个会直接报 "different paths to the SDK" 并拒绝配置。
      # 因此两个变量必须显式指向同一目录。
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 仓库未提交 gradlew，wrapper properties 原本指向腾讯云镜像，
      # 在 GitHub Actions 网络环境下不如官方源稳定，这里显式指定 Gradle 8.0。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0'

      # 不依赖第三方 setup-android action，直接用官方 cmdline-tools 装 SDK。
      - name: Install Android SDK
        run: |
          set -x
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          mkdir -p "$ANDROID_HOME"
          cd "$ANDROID_HOME"
          if [ ! -d cmdline-tools/latest ]; then
            curl -sSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdtools.zip
            mkdir -p cmdline-tools/latest
            mv cmdline-tools/bin cmdline-tools/lib cmdline-tools/NOTICE.txt cmdline-tools/source.properties cmdline-tools/latest/ 2>/dev/null || true
          fi
          yes | cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          # 自检：确认 SDK 真的装好了，避免后续步骤拿到空目录才报错
          ls -l "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          # AGP 8.0.2 默认 NDK 版本是 25.1.8937393，未装会触发自动下载并失败；
          # 26.3 一并装上作为备用。同时在 build.gradle 里钉死 ndkVersion。
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;25.1.8937393" "ndk;26.3.11579264" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.1.8937393" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 仓库不提交 keystore.properties（见 .gitignore），所以 release 原本输出
      # app-release-unsigned.apk —— 这种包装不上 Android，必须先手工补签。
      #
      # 这里用固定参数的 keytool 生成一把 CI 专用 debug key，让 release 也变成
      # 已签名 APK，能直接下载安装。
      #
      # 为什么 distinguished name / 密码全部写死而不是随机：
      #   keytool 每次生成的是不同私钥，签名就不匹配，用户升级 APK 时会被
      #   「签名不一致」拒绝，必须先卸载。写死常量后，每次 CI 跑出来的 key
      #   完全一样，前后版本可以覆盖升级。
      #
      # 注意：这是公开可见的 debug key（写在 workflow 里），仅用于「装得上、
      # 能覆盖升级」，不具备任何安全意义。要用自己的私钥发布请改为：
      #   1) 把 keystore 用 base64 存进 Secrets.KEYSTORE_BASE64
      #   2) 本步骤改为 base64 -d 还原，并把 storePassword/keyAlias/keyPassword
      #      也从 Secrets 取
      - name: Generate CI signing key
        run: |
          set -e
          KS="$RUNNER_TEMP/ci-signing.jks"
          keytool -genkeypair -v \
            -keystore "$KS" \
            -storetype JKS \
            -alias qqbypass_ci \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass qqbypass_ci_store \
            -keypass qqbypass_ci_key \
            -dname "CN=QQEnhancedBypass CI, OU=CI, O=QQEnhancedBypass, L=CI, S=CI, C=XX"
          keytool -list -v -keystore "$KS" -storepass qqbypass_ci_store | grep -E 'Alias|Created'
          {
            echo "storeFile=$KS"
            echo "storePassword=qqbypass_ci_store"
            echo "keyAlias=qqbypass_ci"
            echo "keyPassword=qqbypass_ci_key"
          } > keystore.properties
          echo "--- keystore.properties (path redacted) ---"
          sed 's|^storeFile=.*|storeFile=<path>|' keystore.properties

      - name: Build Release APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace --info --warning-mode all 2>&1 | tee /tmp/gradle-build.log
          rc=${PIPESTATUS[0]}
          echo "::group::gradle exit code"
          echo "rc=$rc"
          echo "::endgroup::"
          if [ "$rc" -ne 0 ]; then
            echo "::group::last 200 lines of gradle log"
            tail -200 /tmp/gradle-build.log || true
            echo "::endgroup::"
            echo "::group::gradle error lines"
            grep -nE 'FAILURE|What went wrong|Caused by|error:|ERROR:|Could not|not found|Unsupported|Task .* FAILED' /tmp/gradle-build.log | head -80 || true
            echo "::endgroup::"
          fi
          exit $rc

      - name: Verify Xposed entry survived R8
        # 本次修复的核心回归校验：R8 必须保留 XposedEntry 与全部 hook 类，
        # 否则安装后必然 ClassNotFoundException，模块静默失效。
        run: |
          # 上一步已生成 keystore.properties，release 现在会带 CI debug 签名。
          # 产物文件名是 app-release.apk；若签名步骤缺失才会退化为
          # app-release-unsigned.apk。用 glob 兼容两者。
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2-)
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "::error::APK not generated under app/build/outputs/apk/release/"
            ls -lR app/build/outputs 2>/dev/null || true
            exit 1
          fi
          echo "APK=$APK"
          # 明确打印 dex 清单，verify 失败时能直接看出是哪个文件里没有目标类
          unzip -l "$APK" | grep -E 'classes[0-9]*\.dex' || true
          echo "=== APK size ==="
          ls -l "$APK"
          # 用 grep -a 而不是 strings：CI 镜像可能没有 binutils
          dexdump() { unzip -p "$APK" "$1" 2>/dev/null | grep -a -o -E "$2" | sort -u; }
          echo "=== entry class check ==="
          for d in $(unzip -l "$APK" | grep -o -E 'classes[0-9]*\.dex' || echo classes.dex); do
            if dexdump "$d" 'io/github/xalsace/qqbypass/XposedEntry' | grep -q .; then
              echo "OK: XposedEntry survived R8 (in $d)"
              found=1
              break
            fi
          done
          if [ "${found:-0}" != "1" ]; then
            echo "::error::XposedEntry was stripped by R8, proguard rules not effective"
            exit 1
          fi
          for c in UnifiedHookCoordinator NetworkReportHook RootDetectionHook XposedDetectionHook DeviceInfoHook DebugDetectionHook RuntimeMonitorHook QQ950PatchHook; do
            ok=0
            for d in $(unzip -l "$APK" | grep -o -E 'classes[0-9]*\.dex' || echo classes.dex); do
              if dexdump "$d" "io/github/xalsace/qqbypass/hooks/$c" | grep -q .; then ok=1; break; fi
            done
            if [ "$ok" = "1" ]; then
              echo "OK: $c"
            else
              echo "::error::hook class stripped: $c"
              exit 1
            fi
          done
          echo "=== assets/xposed_init ==="
          unzip -p "$APK" assets/xposed_init
          echo "=== manifest xposed meta-data ==="
          if unzip -p "$APK" AndroidManifest.xml 2>/dev/null | grep -a -q 'xposedmodule'; then
            echo "OK: manifest contains xposedmodule"
          else
            echo "::warning::manifest may be missing xposedmodule meta-data"
          fi
          echo "=== ALL CHECKS PASSED ==="

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          if-no-files-found: warn

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: QQEnhancedBypass-release
          # 未签名构建输出 app-release-unsigned.apk，glob 两者都覆盖
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 打 v* tag 时自动发布到 Release
      - name: Verify APK is signed
        # 兜底：如果任何原因导致 keystore.properties 没生成，AGP 会静默产出
        # app-release-unsigned.apk —— 它绕过了所有上面的校验，但装不上设备。
        # 这里显式断言 APK 里存在签名块，把这个失败提前暴露出来。
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -printf '%T@ %p\n' | sort -rn | head -1 | cut -d' ' -f2-)
          echo "APK=$APK"
          echo "=== filename check ==="
          case "$APK" in
            *unsigned*) echo "::error::APK is unsigned: $APK"; exit 1 ;;
          esac
          echo "=== META-INF signature block check (v1) ==="
          if unzip -l "$APK" | grep -qE 'META-INF/.*\.(RSA|DSA|EC)$'; then
            unzip -l "$APK" | grep -E 'META-INF/.*\.(RSA|DSA|EC|SF|MF)$'
            echo "OK: v1 signature present"
          else
            echo "::error::no v1 signature block found in $APK"
            exit 1
          fi

      - name: Verify native libs are packaged
        # native hook 现已默认开启，所以 libnative-bypass.so 必须真的在包里。
        # 这个检查至关重要：externalNativeBuild 配了不代表产出成功 ——
        # 之前本地 proot 环境（x86_64 SDK on aarch64 host）构建出的 APK 里
        # .so 数量就是 0，而 assembleRelease 照样成功、照样通过所有其他检查。
        # 没有这一步，native 会静默降级成「只有 Java 层」，且毫无线索。
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -printf '%T@ %p\n' | sort -rn | head -1 | cut -d' ' -f2-)
          echo "APK=$APK"
          echo "=== .so contents ==="
          unzip -l "$APK" | grep -E 'lib/.*\.so$' || true
          echo "=== assertions ==="
          missing=0
          for abi in arm64-v8a armeabi-v7a; do
            for lib in libnative-bypass.so libbytehook.so; do
              if unzip -l "$APK" | grep -q "lib/$abi/$lib"; then
                echo "OK: lib/$abi/$lib"
              else
                echo "::error::missing lib/$abi/$lib"
                missing=1
              fi
            done
          done
          if [ "$missing" != "0" ]; then
            echo "::error::native libs not packaged - native hooks will silently fall back to Java only"
            exit 1
          fi
          echo "OK: native libs present for both ABIs"

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
